[package]
name = "velocity-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Core optimization daemon for Velocity OS"
repository = "https://github.com/velocity-os/velocity-engine"
authors = ["Velocity OS Team"]
copyright = "Copyright (C) 2026 Velocity OS Team"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
zbus = { version = "4.4", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
sysinfo = "0.30"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.10", features = ["v4"] }
notify = "6.1"
libc = "0.2"
glob = "0.3"
regex = "1.10"
dirs = "5.0"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
humantime = "2.1"
signal-hook = "0.3"
home = "0.5"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
tokio-test = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "velocity-engine"
path = "src/main.rs"

[[bin]]
name = "velocityctl"
path = "src/cli.rs"
