name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Prerelease suffix (leave empty for stable)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  version-bump:
    name: Bump version and tag
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Read current version
        id: current
        run: |
          CURRENT=$(grep -E '^version = "[^"]+"' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/' | tr -d '\n')
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump }}"
          CURRENT_BASE="${{ steps.current.outputs.current }}"
          # Strip prerelease suffix if any
          CURRENT="${CURRENT_BASE%%-*}"
          echo "Base version: ${CURRENT}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT}"

          case "${BUMP_TYPE}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch|*)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          PRERELEASE="${{ github.event.inputs.prerelease }}"

          if [ -n "${PRERELEASE}" ]; then
            NEW_VERSION="${NEW_VERSION}-${PRERELEASE}"
          fi

          echo "New version: ${NEW_VERSION}"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Update Cargo.toml
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ env.NEW_VERSION }}\"/" Cargo.toml

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore(release): bump version to ${{ env.NEW_VERSION }} [skip ci]"
          git tag -a "v${{ env.NEW_VERSION }}" -m "Release v${{ env.NEW_VERSION }}" || true
          git push origin HEAD:main
          git push origin "v${{ env.NEW_VERSION }}"

      - name: Trigger release workflow
        if: ${{ github.event.inputs.prerelease == '' }}
        run: |
          echo "Tag v${{ env.NEW_VERSION }} pushed. Release workflow will trigger automatically."
