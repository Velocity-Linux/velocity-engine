name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"
      prerelease:
        description: "Mark as prerelease?"
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: velocity-engine-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-unknown-linux-musl
            artifact: velocity-engine-x86_64-unknown-linux-musl.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config musl-tools

      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Configure musl linker
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"

      - name: Determine version
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="snapshot-${SHORT_SHA}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="target/${{ matrix.target }}/release"
          ls -la "${BIN_DIR}"
          test -f "${BIN_DIR}/velocity-engine"
          test -f "${BIN_DIR}/velocityctl"

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          BIN_DIR="target/${{ matrix.target }}/release"
          ENGINE_BIN="${BIN_DIR}/velocity-engine"
          CTL_BIN="${BIN_DIR}/velocityctl"

          echo "Packaging from: ${BIN_DIR}"
          ls -la "${BIN_DIR}"

          test -d "${BIN_DIR}"
          test -f "${ENGINE_BIN}"
          test -f "${CTL_BIN}"

          tar -czf "release/${{ matrix.artifact }}" \
            -C "${BIN_DIR}" \
            velocity-engine \
            velocityctl

      - name: Compute checksums
        run: |
          cd release
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
