name: Arch Package

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version override"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-package:
    name: Build Arch Linux Package
    runs-on: ubuntu-22.04
    container:
      image: archlinux/archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            cargo \
            rust \
            pkg-config \
            dbus \
            sudo

      - name: Create non-root builder user
        run: |
          useradd -m -G wheel -s /bin/bash builder
          echo "%wheel ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder /github/workspace

      - name: Determine version from tag or source
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep -E '^pkgver=' PKGBUILD | cut -d'=' -f2)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD version
        shell: bash
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Generate .SRCINFO
        shell: bash
        run: |
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

      - name: Build package
        shell: bash
        run: |
          sudo -u builder makepkg -s --noconfirm

      - name: Upload package artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Arch package ${{ steps.version.outputs.version }}"
          prerelease: true
          files: |
            velocity-engine-*.pkg.tar.zst
            .SRCINFO
            PKGBUILD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
